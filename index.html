<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e0edff">
  <title>Mood Switcher · A Little Encouragement</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">TAKE A MOMENT FOR YOURSELF</p>
    <h1>Change My Mood</h1>
    <p id="message" role="status" aria-live="polite" aria-atomic="true">Take your time. You’re moving forward.</p>
    <button id="change-mood" type="button">Change My Mood <span aria-hidden="true">↻</span></button>
    <p class="hint">A new color. A little encouragement. Just one click.</p>
  </main>
  <footer>Even a small step deserves to be celebrated.</footer>
</body>
</html>
